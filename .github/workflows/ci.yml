name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ruby:
    name: ruby ${{ matrix.ruby }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        ruby: ["3.3", "4.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Install RuboCop
        run: gem install rubocop --no-document
      # The smoke run plants a credential through the real provider, which on
      # Linux is secret-tool. Without the binary the checks are skipped, and a
      # skipped leak probe proves nothing.
      - name: Install secret-tool
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-tools
      - name: Lint
        run: rubocop
      - name: Test
        run: rake test
      # Runs the built CLI against a stub worker and reads the bytes it
      # printed. The unit suite asserts what the code should do; this asserts
      # what a user's terminal and a script's pipe actually receive.
      - name: Smoke
        run: rake smoke

  python:
    name: python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync
        working-directory: pyworker
        run: uv sync --all-groups
      - name: Lint
        working-directory: pyworker
        run: |
          uv run ruff check ..
          uv run ruff format --check ..
      - name: Test
        working-directory: pyworker
        run: uv run pytest

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
